<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Crossed Spoon and Fork Logo in Tablecraft Orange -->
  <g transform="translate(100, 100)">
    <!-- Fork (angled from bottom-left to top-right) -->
    <g transform="rotate(45)">
      <!-- Handle -->
      <path d="M-5 15 L-5 70 C-5 74 -1 78 0 78 C1 78 5 74 5 70 L5 15 Z" fill="#f97316" />
      <!-- Neck -->
      <path d="M-6 15 C-6 5 -12 -5 -14 -15 L14 -15 C12 -5 6 15 6 15 Z" fill="#f97316" />
      <!-- Tines -->
      <path d="M-14 -15 L-14 -55 C-14 -58 -10 -58 -10 -55 L-10 -25 C-10 -20 -8 -20 -8 -25 L-8 -55 C-8 -58 -4 -58 -4 -55 L-4 -25 C-4 -20 4 -20 4 -25 L4 -55 C4 -58 8 -58 8 -55 L8 -25 C8 -20 10 -20 10 -25 L10 -55 C10 -58 14 -58 14 -55 L14 -15 Z" fill="#f97316" />
    </g>

    <!-- Spoon (angled from bottom-right to top-left) -->
    <g transform="rotate(-45)">
      <!-- Handle -->
      <path d="M-5 15 L-5 70 C-5 74 -1 78 0 78 C1 78 5 74 5 70 L5 15 Z" fill="#f97316" />
      <!-- Spoon Bowl -->
      <ellipse cx="0" cy="-36" rx="20" ry="28" fill="#f97316" />
    </g>
  </g>
</svg>
